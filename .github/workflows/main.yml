name: build-erofs-dump-windows-msys2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-liblz4
            mingw-w64-x86_64-zlib

      - name: Clone erofs-utils
        run: |
          git clone --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git \
            erofs-utils

      - name: Build dump.erofs
        run: |
          cd erofs-utils
          [ -f configure ] || ./autogen.sh || autoreconf -fi

          ./configure \
            --prefix=/mingw64 \
            --without-uuid \
            --disable-xattr \
            --disable-fuse

          make -C lib -j"$(nproc)"
          make -C dump -j"$(nproc)" dump.erofs || make -C dump -j"$(nproc)" all

          mkdir -p out
          find dump -maxdepth 1 -type f -name 'dump.erofs*' \
            -exec cp {} out/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump.erofs-windows-msys2
          path: erofs-utils/out/dump.erofs*
