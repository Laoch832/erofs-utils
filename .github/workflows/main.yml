name: build-erofs-dump-windows-msys2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-zlib

      - name: Install lz4 (try package, fallback to source build)
        run: |
          # 尝试使用 MSYS2 官方包安装 lz4
          if pacman -S --noconfirm --needed mingw-w64-x86_64-lz4; then
            echo "lz4 installed from pacman"
          else
            echo "pacman lz4 package not found, building from source"
            git clone --depth=1 --branch v1.10.0 https://github.com/lz4/lz4.git lz4-src
            cd lz4-src
            make -C lib -j"$(nproc)"
            make -C lib install PREFIX=/mingw64
            cd ..
          fi

      - name: Clone erofs-utils
        run: |
          git clone --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git \
            erofs-utils

      - name: Build dump.erofs
        run: |
          cd erofs-utils
          [ -f configure ] || ./autogen.sh || autoreconf -fi

          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ./configure \
            --prefix=/mingw64 \
            --without-uuid \
            --disable-xattr \
            --disable-fuse

          make -C lib -j"$(nproc)"
          make -C dump -j"$(nproc)" dump.erofs || make -C dump -j"$(nproc)" all

          mkdir -p out
          find dump -maxdepth 1 -type f -name 'dump.erofs*' \
            -exec cp {} out/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump.erofs-windows-msys2
          path: erofs-utils/out/dump.erofs*
