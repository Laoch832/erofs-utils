name: Build Windows binaries

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies and mingw-w64
      run: |
        sudo apt update
        sudo apt install -y autoconf automake libtool pkg-config \
          liblz4-dev libzstd-dev liblzma-dev uuid-dev \
          gcc-mingw-w64-x86-64

    - name: Generate configure script
      run: ./autogen.sh

    - name: Configure for Windows cross-compile (disable uuid, disable -Werror)
      run: |
        ./configure --host=x86_64-w64-mingw32 \
                    --without-uuid \
                    CFLAGS="-Wno-error"

    - name: Build
      run: make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: erofs-utils-windows
        path: |
          dump/.libs/dump.erofs.exe
          mkfs/.libs/mkfs.erofs.exe
          fsck/.libs/fsck.erofs.exe
